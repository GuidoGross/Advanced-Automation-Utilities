name: Bug report
description: Report a reproducible problem with the library.
title: "[Bug]: "
body:
    -
        type: markdown
        attributes:
            value: >
                This is a public report. Do not include credentials or personal data. For security vulnerabilities, do not use this form; follow the [security policy](https://github.com/GuidoGross/Advanced_Automation_Utilities/blob/main/SECURITY.md).
    -
        type: input
        id: library_version
        attributes:
            label: Library version
            description: Which version of Advanced Automation Utilities are you using?
            placeholder: 1.3.2
        validations:
            required: true
    -
        type: input
        id: python_version
        attributes:
            label: Python version
            description: Include the full Python version if known.
            placeholder: 3.10.0
        validations:
            required: true
    -
        type: input
        id: windows_version
        attributes:
            label: Windows version
            description: Include the Windows version and build if known.
            placeholder: Windows 11, version 24H2
        validations:
            required: true
    -
        type: textarea
        id: steps_to_reproduce
        attributes:
            label: Steps to reproduce
            description: Provide a minimal example and the steps needed to reproduce the problem.
            placeholder: |
                1. Initialize the relevant component...
                2. Call the following method...
                3. Observe the result...
        validations:
            required: true
    -
        type: textarea
        id: expected_behavior
        attributes:
            label: Expected behavior
            description: What did you expect to happen?
        validations:
            required: true
    -
        type: textarea
        id: actual_behavior
        attributes:
            label: Actual behavior
            description: What happened instead? Include relevant error messages or tracebacks.
        validations:
            required: true
    -
        type: textarea
        id: additional_context
        attributes:
            label: Additional context
            description: Add any other context that may help reproduce or understand the problem.
        validations:
            required: false