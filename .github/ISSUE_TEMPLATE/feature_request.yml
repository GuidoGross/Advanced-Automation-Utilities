name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
body:
    -
        type: textarea
        id: problem_or_use_case
        attributes:
            label: Problem or use case
            description: What problem would this feature solve?
        validations:
            required: true
    -
        type: textarea
        id: proposed_solution
        attributes:
            label: Proposed solution
            description: Describe the behavior or API you would like to see.
        validations:
            required: true
    -
        type: textarea
        id: alternatives_considered
        attributes:
            label: Alternatives considered
            description: Describe any alternatives or workarounds you have considered.
        validations:
            required: false
    -
        type: textarea
        id: additional_context
        attributes:
            label: Additional context
            description: Add examples or context that may help evaluate the request.
        validations:
            required: false